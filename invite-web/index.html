<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PartyPlus Invite</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0b0f14;
        color: #e7eef7;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px 18px;
      }
      .card {
        background: #121a24;
        border: 1px solid #223044;
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 10px 0;
        line-height: 1.45;
        color: #c9d6e6;
      }
      .id {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        background: #0b111a;
        border: 1px solid #223044;
        border-radius: 10px;
        padding: 10px 12px;
        margin-top: 10px;
        word-break: break-all;
      }
      .btnrow {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      a.btn {
        display: inline-block;
        padding: 12px 14px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
      }
      .primary {
        background: #2b8cff;
        color: #081018;
      }
      .ghost {
        border: 1px solid #2b8cff;
        color: #b8d7ff;
      }
      .tiny {
        margin-top: 14px;
        font-size: 12px;
        opacity: 0.75;
      }
      .fallback {
        margin-top: 16px;
        padding: 14px;
        border: 1px solid #2c4260;
        border-radius: 12px;
        background: #101726;
      }
      .fallback-title {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 700;
        color: #f8fbff;
      }
      .fallback-text {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: #d9e5ff;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>PartyPlus Invite</h1>
        <p id="subtitle"></p>
        <div id="details"></div>

        <div class="id" id="inviteId">-</div>

        <div class="btnrow">
          <a class="btn primary" id="openApp" href="#">Open in PartyPlus</a>
          <a class="btn ghost" id="getApp" href="#">Get the app</a>
        </div>

        <p class="tiny">Tip: If PartyPlus isn't installed yet, this page will still load.</p>
        <div class="fallback">
          <p class="fallback-title">If PartyPlus doesn't open automatically</p>
          <p class="fallback-text">
            Open the app and use <b>Pick a Party</b> after opening this invite.
          </p>
        </div>
      </div>
    </div>

    <script>
      function fromBase64Url(input) {
        let b64 = input.replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4) b64 += "=";
        return atob(b64);
      }

      function decodeInviteData(dParam) {
        const raw = decodeURIComponent(dParam);
        const decoded = fromBase64Url(raw);
        const json = decodeURIComponent(decoded);
        return JSON.parse(json);
      }

      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const inviteId = pathParts[0] === "i" ? pathParts[1] : null;

      const inviteIdEl = document.getElementById("inviteId");
      if (inviteIdEl && inviteId) inviteIdEl.textContent = inviteId;

      const url = new URL(window.location.href);
      const d = url.searchParams.get("d") || "";
      const subtitle = document.getElementById("subtitle");
      const details = document.getElementById("details");

      if (d) {
        try {
          const party = decodeInviteData(d);
          subtitle.textContent = party.t || "You're invited!";

          const rows = [];
          if (party.dt) rows.push(`<p><b>When:</b> ${party.dt}</p>`);
          if (party.l) rows.push(`<p><b>Where:</b> ${party.l}</p>`);
          if (party.a) rows.push(`<p>${party.a}</p>`);

          details.innerHTML = rows.join("");
        } catch (e) {
          subtitle.textContent = "This invite looks corrupted.";
          details.innerHTML = "<p>Please ask the host to resend it.</p>";
        }
      } else {
        subtitle.textContent = "You're invited!";
      }

      const directPartyPath = `party/${encodeURIComponent(inviteId || "")}`;
      const nativeSchemeLink = d
        ? `partyplusnative://${directPartyPath}?d=${encodeURIComponent(d)}`
        : `partyplusnative://${directPartyPath}`;

      const openApp = document.getElementById("openApp");
      const getApp = document.getElementById("getApp");
      openApp.href = nativeSchemeLink;
      openApp.setAttribute("href", nativeSchemeLink);

      getApp.href = "https://play.google.com/store/search?q=partyplus&c=apps";
      getApp.target = "_blank";
      getApp.rel = "noopener noreferrer";

      // Preview-stage flow: always open the web invite first, then let the user
      // launch the app with one explicit custom-scheme tap.
    </script>
  </body>
</html>
